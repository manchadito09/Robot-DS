local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.16
      # static_layer FIRST -- and this is what stops the robot driving into GLASS.
      #
      # No sensor on this robot can see glass: the lidar goes straight through it, and so does the
      # depth camera's infrared. The ONLY record that a glass wall exists is the map (it got mapped
      # because there were cardboard boxes in front of it at the time).
      #
      # The global costmap already had static_layer, so the PLANNER routed around the glass. But the
      # local costmap did not, so TEB -- the thing that actually turns the wheels -- saw open floor
      # there and cut the corner straight into it. Planner polite, driver blind. That is exactly how
      # the robot hit the Cristal room glass on a Secondary stairs -> Chess trip.
      #
      # Cost of this: the map's walls now appear in the local costmap, so if AMCL drifts they land
      # in the wrong place and the robot dodges a phantom. That was a real fear while AMCL was
      # teleporting between rooms; it is not, now that the map has been redone and localization is
      # stable. Worth it -- a phantom wall makes the robot swerve, glass makes it crash.
      # camera_layer is BACK (it was out for a few hours on 14-jul). It had started marking the FLOOR
      # as a wall -- 27 obstacles a scan on empty floor, against 14 from a healthy camera -- and
      # because it never clears its marks (below), the robot painted a cage around itself and stopped
      # dead in open floor. The cause was mine: I had turned the camera's IR stream off that morning,
      # to free USB bandwidth, on the grounds that "nothing reads /depth_cam/ir/*". True, and
      # irrelevant: the IR projector is HOW THIS CAMERA MEASURES DEPTH. Without it the depth degraded,
      # the floor-plane fit drifted, and the floor came back as an obstacle. IR back on -> 13 hits on
      # empty floor, clean. Never turn it off again.
      #
      # It is in the LOCAL costmap only. The global one is where its marks rot: camera_layer has
      # clearing: False (deliberately -- see below) and the global costmap never forgets, so every
      # false positive and every passer-by stayed there for the life of the run. The local costmap is
      # a 3 m rolling window that flushes itself as the robot moves.
      plugins: ["static_layer", "voxel_layer", "camera_layer", "denoise_layer", "inflation_layer"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        # TEST 12-jul: OFF. It wipes obstacle islands smaller than minimal_group_size, and a
        # chair leg is ~1 cell at 5 cm resolution -> it was erasing every camera mark.
        enabled: False
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.20
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # The depth camera gets its OWN layer, NOT the lidar's. Sharing a layer did not work: the lidar
      # beam (16.8 cm) passes OVER a chair leg and hits the wall behind, so its raytrace-clearing
      # wiped the camera's mark as fast as the camera made it -- the robot saw the leg, forgot it,
      # and clipped it. In a layer of its own nothing else can erase these marks.
      #
      # CLEARING IS ON NOW, and this is the fix for the robot freezing in open floor and never
      # moving again. It used to be off, so the camera could mark but never unmark. Then: the robot
      # hesitates, Nav2's recovery spins it on the spot, the camera sweeps a full circle marking as
      # it goes, and none of it ever expires -- it paints a cage around itself, and the harder it
      # fights the more it spins and the more it paints. costmap_view.py caught it red-handed: 59%
      # of the local costmap lethal, walls pressed against the robot, and the map and the lidar both
      # saying open floor.
      #
      # raytrace_min_range 0.5 is what makes clearing safe: the camera never erases anything closer
      # than 50 cm. That is its blind spot -- exactly where the chair leg it is closing in on ends
      # up. Without this, a leg that drops out of view at close range gets raytraced away by the
      # "no return" ray passing through it, which is the bug clearing: False was hiding from.
      #   beyond 50 cm -> the camera may unmark what it can now see is clear (kills the ghosts)
      #   inside 50 cm -> the mark stands, whatever the camera thinks (keeps the legs)
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: camera_scan
        camera_scan:
          topic: /camera_scan
          # camera_scan is a 2D LaserScan at floor level (z=0); the node already filtered
          # obstacle HEIGHT, so do NOT re-filter by z here or every ray is dropped
          # (min_obstacle_height > 0 discards the z=0 scan -> the layer never marks).
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          # 0.2, NOT 0.5. This one line built the cage, and the cage was caught on camera.
          #
          # The robot stopped dead in the middle of an open floor -- 8.9 m from the nearest map
          # edge, AMCL verified correct to 9 cm -- and TEB said "trajectory is not feasible" for
          # ever. costmap_view.py, run while it was stuck, showed why:
          #
          #     WHAT TEB SAW                  THE MAP AT THE SAME SPOT
          #     ##############RR.#########    ...............R..........
          #     ##############RR##########    ....#.....................
          #     +##############.##########    ...............#..........
          #
          # Walled in, on both sides and BEHIND, in a room where Rodrigo -- standing next to it --
          # could see nothing at all except some furniture a metre in front. The gap it had left
          # itself was three cells wide: 30 cm, for a robot whose inflated radius is 36. It had
          # strangled itself.
          #
          # Where the walls came from: the camera sees 90 degrees, forward. It marks what it sees.
          # Then the robot turns, and those marks are now BESIDE it -- and no camera ray will ever
          # pass through them again, so the layer can never take them back. Spin to recover, and it
          # lays a fresh ring of them. The marks that trap it are the ones RIGHT AGAINST it, and
          # with raytrace_min_range at 0.5 every one of those is immortal by construction.
          #
          # The fear that put 0.5 there was real but backwards: "the controller must not raytrace
          # away the chair leg it is about to hit". It cannot. Clearing happens only where the
          # camera SEES FREE SPACE. A leg still there is still seen, and still marked. 0.5 did not
          # protect the leg -- it protected every ghost and every stale mark inside half a metre,
          # and those are exactly the ones that stop the robot from moving at all.
          #
          # 0.2 matches camera_scan_node's RANGE_MIN: below that the scan reports nothing anyway,
          # and 20 cm is inside the robot's own 16 cm body.
          raytrace_min_range: 0.2
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          # MARKS EXPIRE AFTER 3 SECONDS, and this is the real fix for the cage that raytrace could
          # only soften. The camera sees 90 degrees, forward. It marks a chair leg, the robot turns,
          # and that mark is now BESIDE or BEHIND it, where no future ray will ever pass to clear it.
          # Spin to recover and it lays a whole ring of them. Those marks are why the robot could not
          # set off from a standing start -- "I couldn't reach Fridge" three times -- but arrived the
          # moment it was nudged and the rolling window scrolled the stale marks out.
          #
          # observation_persistence expires every mark this many seconds after it was seen, whether
          # or not a ray ever comes back to clear it. 3 s is long enough that a real leg 1.5 m ahead
          # at 0.4 m/s is re-seen and re-marked twice before it expires, and short enough that the
          # ghost ring a spin leaves behind is gone before the next goal. This is the LOCAL costmap
          # only -- the controller's 3 m rolling window -- so a forgotten mark just gets re-marked
          # the instant the camera sees the real obstacle again.
          observation_persistence: 3.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.1
      resolution: 0.05
      track_unknown_space: true
      # camera_layer is back here too, and it is what lets the robot REPLAN instead of giving up.
      #
      # It was pulled out because clearing: False made its marks immortal, and a global costmap never
      # forgets: every false positive and every passer-by stayed for the life of the run, until the
      # robot was refusing gaps it obviously fits through. That is fixed at the source now -- the
      # layer clears (see the local costmap above), so its marks expire on their own.
      #
      # With it out, the PLANNER could not see low obstacles at all. So when a chair blocked the way,
      # the planner kept happily insisting on a route straight through it while TEB, which could see
      # it, refused to drive -- and the robot just sat there. It was not confused: it was following a
      # plan nobody would let it execute. The planner has to know the chair is there to route around
      # it.
      plugins: ["static_layer", "obstacle_layer", "camera_layer", "denoise_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # Low obstacles (chair legs) go in the GLOBAL costmap too, so the PLANNER routes AROUND them
      # instead of straight through. Without this the planner cannot see them at all, and when a
      # chair blocks the way it keeps insisting on a route through it while TEB refuses to drive --
      # the robot sits there, following a plan nobody will let it execute.
      #
      # Own layer, NOT the lidar's: sharing one meant the lidar's raytrace (its beam passes OVER the
      # leg) cleared the camera's marks as fast as they appeared.
      #
      # Same clearing rules as the local costmap: clearing ON so marks expire (they used to be
      # immortal here, and a global costmap never forgets -- it filled with ghosts until the robot
      # refused gaps it obviously fits through), and raytrace_min_range 0.5 so the camera never
      # erases anything inside its own blind spot, where the leg it is approaching ends up.
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: camera_scan
        camera_scan:
          topic: /camera_scan
          # camera_scan is a 2D LaserScan at floor level (z=0); the node already filtered
          # obstacle HEIGHT, so do NOT re-filter by z here or every ray is dropped
          # (min_obstacle_height > 0 discards the z=0 scan -> the layer never marks).
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          # 0.0 HERE, unlike the local costmap, and this is the difference between a global costmap
          # that stays clean and one that slowly rots.
          #
          # The local one keeps 0.5: the CONTROLLER must not raytrace away the chair leg it is
          # closing in on, once that leg drops into the camera's blind spot at close range.
          #
          # The PLANNER has no such problem -- it is drawing a thirty-metre route, not steering
          # around something 20 cm from its wheels. But with 0.5 here, any mark the robot then drove
          # up to became permanent (too close to clear) in a costmap that never forgets. They piled
          # up wherever the robot had been, and the longer navigation had been running the more
          # often it refused a perfectly open route. Intermittently -- which is the worst kind, and
          # exactly what "sometimes it gets stuck, sometimes it doesn't" is.
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        # TEST 12-jul: OFF, same reason as in the local costmap above.
        enabled: False
        minimal_group_size: 3
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False 

