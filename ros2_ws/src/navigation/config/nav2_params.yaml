amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    # BEAM SKIPPING ON -- this is the glass.
    #
    # Measured next to the Cristal room glass, robot standing still and facing it: of the beams that
    # came back at all, only 31% landed on a wall the map knows about; 48% landed in what the map
    # calls open floor, a median 0.39 m from anything. Facing an ordinary wall, from the same robot
    # minutes earlier: 99.7% explained, 5 cm median. And only 130 beams returned at the glass versus
    # 310 at the wall -- HALF the beams simply never come back.
    #
    # A lidar shoots straight through glass. The beams that survive land somewhere inside the room
    # beyond it, where the map says empty floor, and AMCL reads "these beams don't fit -- I must not
    # be where I think I am" and slides. Which is exactly what we saw: mislocalized, always at the
    # same spot, then straight into the glass, because the static_layer wall it was avoiding had
    # slid with it.
    #
    # Beam skipping is AMCL's built-in answer: beams that most particles find inconsistent with the
    # map get dropped from the update instead of dragging the estimate around. The glass beams get
    # ignored; the ones hitting real walls still do their job.
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.2
    # "..._prob", not plain "likelihood_field". Beam skipping (below) is the whole point, and in
    # nav2_amcl (amcl_node.cpp:1030) do_beamskip is ONLY passed to the sensor model when the type is
    # "likelihood_field_prob". With plain "likelihood_field" the flag is read, stored, and silently
    # ignored -- the switch is not wired to anything.
    laser_model_type: "likelihood_field_prob"
    max_beams: 60
    max_particles: 5000
    min_particles: 1500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: True
    initial_pose: 
      x: 0.0
      y: 0.0
      yaw: 0.0

