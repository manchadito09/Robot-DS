controller_server:
  ros__parameters:
    odom_topic: /odom
    use_sim_time: False
    controller_frequency: 15.0   # navegacion normal (ligera): la Jetson SI llega. El mapeo usa su propia config a 8 Hz.
    failure_tolerance: 1.0   # segundos sin comando valido antes de fallar (antes 0 -> se rendia al instante)

    # Progress checker parameters
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0   # antes 10: mas paciencia si le bloqueas el paso
    
        # Goal checker parameters
    goal_checker_plugins: ["goal_checker"] 
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30

    # 把下面两行改成 “FollowPath”，BT 里就能找到
    controller_plugins: ["FollowPath"]
    controller_plugin_types: ["nav2_rotation_shim_controller::RotationShimController"]

    # 下面配置也是跟 “FollowPath” 绑定
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      # —— 旋转阈值 —— 
      angular_dist_threshold: 1.2     # solo rota en sitio si el rumbo difiere > 1.2 rad (antes 0.8 -> giraba demasiado)
      forward_sampling_distance: 0.3  # 用前 0.3m 路径方向作为目标朝向
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 3.2
      simulate_ahead_time: 0.3

      primary_controller: "teb_local_planner::TebLocalPlannerROS"
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: True
      allow_init_with_backwards_motion: False
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: 0.3
      global_plan_prune_distance: 1.0
      exact_arc_length: False
      feasibility_check_no_poses: 5
      publish_feedback: False
          
      # Robot
      # 0.40 m/s (was 0.22). It was dropped to 0.22 "to give room to react to low obstacles" back
      # when the depth camera was not reaching the costmap -- the robot was crawling to make up for
      # being blind. It can see chair legs now (0.36-1.25 m ahead), which at 0.40 m/s is still ~2.5 s
      # of warning, and the controller runs at 10 Hz. A guide robot at 0.22 m/s (0.8 km/h) makes the
      # visitor it is leading stand around waiting; walking pace is ~1.3 m/s.
      # THREE ceilings chain here, lowest wins: this, velocity_smoother.max_velocity in
      # nav2_params.yaml (0.5), and the driver clamp in odom_publisher_node.py (raised to 0.40 too).
      max_vel_x: 0.40
      max_vel_theta: 2.0
      acc_lim_x: 1.0
      acc_lim_theta: 2.0
      #max_vel_x_backwards: 0.001
      #penalty_epsilon: 0.0001
      #min_turning_radius: 0.0
      #wheelbase: 0.213
      # The tank is a RECTANGLE: 33.0 cm long x 24.6 cm wide (from the CAD meshes in
      # jetrover_description). A circle lies about it in both directions at once: r=0.15 was too
      # small for the corners (they sit 20.6 cm from centre) and too fat for the sides (the robot
      # is only 12.3 cm half-wide). With min_obstacle_dist on top, TEB demanded a 74 cm gap to pass
      # anything -- and simply stopped in front of every narrow spot the robot physically fits.
      # A "line" model is a capsule: the segment below, grown by min_obstacle_dist. That IS the
      # rectangle. Segment half-length = half-length - half-width = 0.165 - 0.123 = 0.042.
      footprint_model: # types: "point", "circular", "two_circles", "line", "polygon"
        type: "line"
        line_start: [-0.042, 0.0]
        line_end: [0.042, 0.0]

      # GoalTolerance
      free_goal_vel: False

      # Obstacles
      # 0.20 = the robot's 12.3 cm half-width + 7.7 cm of real clearance per side.
      # Gap needed to pass: 2 x 0.20 = 40 cm (was 74 cm). If it starts scraping, raise this.
      min_obstacle_dist: 0.20
      inflation_dist: 0.22      # must stay >= min_obstacle_dist
      include_costmap_obstacles: True
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15

      dynamic_obstacle_inflation_dist: 0.6
      include_dynamic_obstacles: True 

      # TEST 12-jul: converter OFF -> TEB reads the costmap cells directly as point obstacles.
      # CostmapToPolygonsDBSMCCH is DBSCAN: it drops clusters below cluster_min_pts (default 2)
      # as noise, and a chair leg is ~1 cell at 5 cm. Same disease as the costmap's denoise_layer:
      # the planner routed around the chair (it is in the global costmap) but TEB, blind to it,
      # cut the corner and clipped it.
      costmap_converter_plugin: ""
      costmap_converter_spin_thread: True
      costmap_converter_rate: 5

      # Optimization
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: True
      optimization_verbose: False
      penalty_epsilon: 0.1
      obstacle_cost_exponent: 4.0
      weight_max_vel_x: 0.5
      weight_max_vel_theta: 0.5
      weight_acc_lim_x: 0.5
      weight_acc_lim_theta: 10.5
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 3.0 # must be > 0  (mas alto = prefiere ir mas rapido)
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 0.2
      weight_dynamic_obstacle: 10.0 # not in use yet
      weight_dynamic_obstacle_inflation: 0.2
      weight_viapoint: 50.0
      weight_adapt_factor: 2.0

      # Homotopy Class Planner
      enable_homotopy_class_planning: False   # off: una sola trayectoria estable (antes True -> zigzag por cambiar de ruta)
      enable_multithreading: True
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: True

      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: True
      delete_detours_backwards: True
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: False
      visualize_with_time_as_z_axis_scale: 0.0

      # Recovery
      shrink_horizon_backup: True
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: True
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False
