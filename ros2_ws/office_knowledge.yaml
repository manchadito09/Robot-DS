# ============================================================
#  BASE DE CONOCIMIENTO DE LA OFICINA  (planta 4)
#  El robot usa esto para HABLAR de cada sitio, no solo para ir allí:
#  elegir mejor el destino, narrar por el camino y responder preguntas.
#
#  CÓMO EDITARLO:
#   - Deja las CLAVES (dev, cocina, ...) IGUAL que en map_01.waypoints.yaml.
#   - Rellena/corrige los textos. Lo que pone "TODO" es una suposición mía.
#   - 'aka' = cómo lo puede llamar la gente al hablar (en inglés, el STT es inglés).
#   - 'category': team | room | amenity | landmark | base
# ============================================================


office:
  company: "Direct Supply"
  floor: "4th floor"
  language: "en"
  vibe: "A friendly, open workspace on the 4th floor where teams build software, meet, and take breaks."

  # What the robot knows about the COMPANY. Without this, "what is Direct Supply?" got "I'm just the
  # guide robot, I don't know much about the company" -- honest, and useless.
  #
  # Researched and checked by Rodrigo, who works here. KEEP IT THAT WAY: this robot talks in front of
  # Direct Supply, and an invented fact that sounds right is far worse than an admitted gap. The
  # prompt tells Claude to use these and invent nothing.
  #
  # Kept SHORT on purpose. Every line is prompt Claude re-reads on every single sentence a visitor
  # says, and the robot only speaks 15 words at a time anyway. Deliberately left out: the street
  # address (the visitor is standing in it), the LinkedIn headcount and the 2016 campus figure (both
  # go stale and neither is interesting), and the DSSI/TELS/Aptura product names as separate lines
  # (jargon to a visitor -- folded into one line instead).
  about:
    - "Direct Supply was founded in 1985 by Bob Hillis, in Milwaukee, Wisconsin."
    - "It has helped senior living communities buy, build and look after their homes for over 40 years."
    - "It works with tens of thousands of care buildings across America."
    - "Its DSSI platform connects more than ten thousand senior living communities to their suppliers, moving around three billion dollars of product a year."
    - "The Milwaukee campus stretches nearly a mile, across eleven buildings, and over a thousand people work here."
    - "It runs as a virtual distributor -- it owns no warehouses or factories of its own."
    - "Its technology centre sits in a historic 19th-century academy building at a nearby engineering university."

  # Facts the robot KNOWS but never volunteers on the walk.
  #
  # `about` does two jobs: it is the pool the robot picks from to fill a corridor, AND the facts
  # Claude answers questions from. Some things belong in the second job only -- true, worth knowing,
  # but not what you say to someone you are walking down a hallway. Product names are the example:
  # three of them in one breath is a brochure, but "what do you actually sell?" deserves an answer.
  #
  # So: `about_extra` is answer-only. Claude sees about + about_extra. The walk only sees `about`.
  # Nothing is duplicated, so nothing can drift.
  about_extra:
    - "Its products include DSSI for buying, TELS for building safety and upkeep, and Aptura for interior and foodservice design."
    - "It also has its own equipment brands, like Panacea, Attendant and Maxwell Thomas."

  # WHAT THE ROBOT SAYS OUT LOUD ON THE WALK. Written to be SPOKEN, not to be read.
  #
  # These used to be the `about` facts, said verbatim -- and `about` is written for CLAUDE, in the
  # third person, so it can quote from it without inventing. Which meant the robot walked visitors
  # down a corridor announcing "It works with tens of thousands of care buildings across America."
  # It. It what? A sentence with no subject, in mid-air. And in the same breath it would say "I'm
  # the guide robot" -- one voice for the notes, another for itself.
  #
  # Two different jobs, so two different lists. Claude reads `about`. The robot SAYS these.
  #
  # The person is settled: "we" is Direct Supply, and the robot counts itself in (it works here).
  # "I" is the robot. Never "it".
  walk:
    - "Direct Supply was founded back in 1985, right here in Milwaukee, by a man named Bob Hillis."
    - "For more than forty years, we have helped senior living communities buy, build, and look after the homes where older Americans live."
    - "We work with tens of thousands of care buildings, all across the United States."
    - "Our software connects more than ten thousand senior living communities to the suppliers they rely on every day."
    - "Every year, we help move around three billion dollars of product to care homes right across America."
    - "Our Milwaukee campus stretches almost a mile, across eleven different buildings, with over a thousand people working here."
    - "For over forty years now, we have built the tools that keep senior living homes safe, supplied, and well designed."

  # The robot's JOKES -- said on the walk, in its own voice, dry and self-deprecating.
  #
  # These used to be hard-coded in guide.py (ROBOT_LINES), which meant every tweak to the humour
  # needed a colcon build. They live here now so the tone can be adjusted without touching code.
  #
  # ONE RULE, because this robot talks in front of Direct Supply and an investor: the joke is always
  # on the ROBOT. Never on the customers, never on senior living, never on anyone in the room. Dry
  # self-deprecation reads as charming; anything else is a risk on camera. Say a new one out loud
  # before adding it -- and re-bake after editing (python3 ~/ros2_ws/prebake_lines.py), because the
  # cache key is a hash of the exact words.
  jokes:
    - "I never get lost. I occasionally get... creatively rerouted."
    - "My top speed is a brisk walk. I am built for elegance, not for racing."
    - "If I bump into something, we agree it never happened. Deal?"
    - "People ask if I am a Roomba. I am not. My sense of direction is far superior. Usually."
    - "I work here every single day, and I have still never once been invited to a meeting."
    - "I don't need the coffee to do my job. But I do envy the smell every morning."
    - "I have this whole floor memorized. Ask me where anything is. Go on, test me."

  # Lines that OPEN A CONVERSATION, said on the walk -- not answers, invitations.
  #
  # The middle of a trip is the one moment you have someone's attention with nothing else going on.
  # A fact fills it. An invitation USES it: the visitor stops being an audience and starts asking,
  # and a robot that gets asked things looks far more alive than one that recites.
  #
  # Say them out loud before you keep them. Every word is another second of someone standing in a
  # corridor, and a line that reads well can still sound like a brochure.
  #
  # These are the robot's OWN voice, so they live here and not in `about` -- Claude answers questions
  # from `about`, and it must not start quoting these back at people as if they were facts.
  chat:
    - "Curious about anything here? Just ask. I know the company, not only the corridors."
    - "I can answer questions while we walk. About Direct Supply, this floor, or about me."
    - "Anything you want to know about Direct Supply?"
    - "You can send me somewhere else at any time. I do not mind changing plans."

  # Sitios que el robot puede ofrecer como destino en la demo:
  demo_places: [Developers, Kitchen, Chess, Cristal room, Hammock]

